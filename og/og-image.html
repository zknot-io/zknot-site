<!doctype html>
<!--
  Source for public/og-image.png (1200x630 share preview). Not deployed: the
  Worker serves ./public only. Colours mirror public/css/zknot-tokens.css and
  the index.html hero (2026-10-18 restyle). Re-render:
    google-chrome --headless=new --hide-scrollbars --window-size=1200,630 \
      --virtual-time-budget=5000 --screenshot=public/og-image.png og/og-image.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&family=DM+Sans:wght@400&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b0d; --bg-card: #111318;
    --text: #e8eaed; --text-dim: #9ca3af; --text-muted: #6b7280;
    --accent: #38bdf8;
  }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  body {
    position: relative;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .glow { position: absolute; top: -220px; left: 50%; transform: translateX(-50%); width: 900px; height: 600px;
          background: radial-gradient(ellipse, rgba(56,189,248,0.07) 0%, transparent 70%); }
  .inner { position: absolute; left: 80px; top: 80px; right: 80px; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo svg { width: 34px; height: 34px; }
  .logo span { font-family: 'IBM Plex Sans', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 0.05em; color: var(--text); }
  .logo sup { font-size: 14px; font-weight: 400; color: var(--text-muted); }
  h1 { font-family: 'IBM Plex Sans', sans-serif; font-weight: 700; font-size: 76px; line-height: 1.12;
       letter-spacing: -0.02em; color: var(--text); margin: 92px 0 0; }
  .l2 { color: var(--text-dim); }
  .l3 { color: var(--accent); }
  p { font-family: 'DM Sans', sans-serif; font-size: 24px; color: var(--text-muted); margin: 52px 0 0; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="inner">
    <div class="logo">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="2" fill="#111318"/>
        <path d="M8 8L16 16L24 8" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 24L16 16L24 24" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
        <circle cx="16" cy="16" r="2.5" fill="#38bdf8"/>
      </svg>
      <span>ZKNOT<sup>™</sup></span>
    </div>
    <h1>Physics enforces.<br><span class="l2">Math proves.</span><br><span class="l3">You verify.</span></h1>
    <p>Hardware attestation &amp; chain of custody · verifyknot.io — no account, no login</p>
  </div>
</body>
</html>
